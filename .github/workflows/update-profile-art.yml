name: Update profile art

on:
  schedule:
    # 06:00 UTC daily — matches config/profile.yaml automation.cron
    - cron: "0 6 * * *"
  workflow_dispatch:

# No `push` trigger → regenerating art cannot re-enter this workflow.
concurrency:
  group: update-profile-art
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Needed so the commit action can push back to the default branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r scripts/requirements-ci.txt

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit changed art (if any)
        id: commit
        run: |
          set -euo pipefail

          git add data/contributions.json assets/contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No contribution art changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "$(cat <<'EOF'
          chore: refresh contribution heatmap

          Daily automated update of contributions.json and contrib-heatmap.svg.
          EOF
          )"

          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
